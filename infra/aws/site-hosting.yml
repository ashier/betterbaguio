AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless static hosting for BetterBaguio.org

Parameters:
  SiteDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain after its ACM certificate is ready
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional us-east-1 ACM certificate covering SiteDomainName
  WwwCertificateArn:
    Type: String
    Default: ''
    Description: Optional us-east-1 ACM certificate covering www.betterbaguio.org
  EnableWwwAlias:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable only after www DNS points to the redirect distribution

Conditions:
  UseCustomDomain: !And
    - !Not [!Equals [!Ref SiteDomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  UseWwwRedirect: !Not [!Equals [!Ref WwwCertificateArn, '']]
  UseWwwAlias: !And
    - !Condition UseWwwRedirect
    - !Equals [!Ref EnableWwwAlias, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub betterbaguio-site-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldSiteVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: BetterBaguio
        - Key: CostCenter
          Value: website

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Private access to the BetterBaguio website bucket
        Name: !Sub betterbaguio-site-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteRouteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub betterbaguio-site-routes-${AWS::AccountId}
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri += '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Resolve directory-style civic information routes to index.html
        Runtime: cloudfront-js-2.0

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: UseWwwRedirect
    Properties:
      Name: !Sub betterbaguio-www-redirect-${AWS::AccountId}
      AutoPublish: true
      FunctionCode: |
        function serializeQueryString(query) {
          var parts = [];
          var keys = Object.keys(query);
          for (var i = 0; i < keys.length; i += 1) {
            var key = keys[i];
            var entry = query[key];
            if (entry.multiValue) {
              for (var j = 0; j < entry.multiValue.length; j += 1) {
                parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(entry.multiValue[j].value));
              }
            } else {
              parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(entry.value || ''));
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: {
                value: 'https://betterbaguio.org' + request.uri + serializeQueryString(request.querystring)
              },
              'cache-control': {
                value: 'public, max-age=3600'
              }
            }
          };
        }
      FunctionConfig:
        Comment: Permanently redirect www.betterbaguio.org to the apex domain
        Runtime: cloudfront-js-2.0

  SiteResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub betterbaguio-site-security-${AWS::AccountId}
        Comment: Security headers for BetterBaguio.org
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: camera=(), microphone=(), geolocation=()
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; connect-src 'self' https://api.open-meteo.com https://d2nylkwmqoqtlx.cloudfront.net; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - UseCustomDomain
          - - !Ref SiteDomainName
          - !Ref AWS::NoValue
        Comment: BetterBaguio.org serverless website
        CustomErrorResponses:
          - ErrorCachingMinTTL: 60
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCachingMinTTL: 60
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRouteFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SiteResponseHeadersPolicy
          TargetOriginId: BetterBaguioSiteOrigin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: BetterBaguioSiteOrigin
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_200
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: BetterBaguio
        - Key: CostCenter
          Value: website

  WwwRedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseWwwRedirect
    Properties:
      DistributionConfig:
        Aliases: !If
          - UseWwwAlias
          - - www.betterbaguio.org
          - !Ref AWS::NoValue
        Comment: Redirect www.betterbaguio.org to the apex domain
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN
          TargetOriginId: BetterBaguioWwwRedirectOrigin
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: BetterBaguioWwwRedirectOrigin
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref WwwCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: BetterBaguio
        - Key: CostCenter
          Value: website

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
          - !If
            - UseWwwRedirect
            - Sid: AllowWwwRedirectCloudFrontReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub ${SiteBucket.Arn}/*
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WwwRedirectDistribution}
            - !Ref AWS::NoValue

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  SiteUrl:
    Value: !Sub https://${SiteDistribution.DomainName}
  WwwRedirectDistributionId:
    Condition: UseWwwRedirect
    Value: !Ref WwwRedirectDistribution
  WwwRedirectDomainName:
    Condition: UseWwwRedirect
    Value: !GetAtt WwwRedirectDistribution.DomainName
  WwwRedirectUrl:
    Condition: UseWwwRedirect
    Value: https://www.betterbaguio.org
