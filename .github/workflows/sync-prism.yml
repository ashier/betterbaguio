name: Sync Baguio PRISM data

on:
  schedule:
    # Monday at 05:17 Asia/Manila (Sunday 21:17 UTC).
    - cron: '17 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-baguio-prism
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and validate PRISM snapshot
        run: node scripts/sync-prism.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "betterbaguio-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prism/projects.json
          if git diff --cached --quiet; then
            echo "PRISM snapshot is unchanged."
            exit 0
          fi
          git commit -m "chore(data): refresh Baguio PRISM snapshot"
          git push
